name: CI and security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Test and Go security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache: false

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests with race detector
        run: go test -race -coverprofile=coverage.out ./...

      - name: Run go vet
        run: go vet ./...

      - name: Build static binary
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o healthcheck .

      - name: Scan reachable Go vulnerabilities
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1
        with:
          repo-checkout: false
          go-version-input: stable
          cache: false
          go-package: ./...

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          show-openssf-scorecard: true

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: stable
          cache: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: go
          build-mode: manual

      - name: Build for CodeQL
        run: go build ./...

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: /language:go

  container:
    name: Build and scan scratch image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build scratch image
        run: docker build --tag container-http-checker:scan .

      - name: Smoke-test HTTP in scratch container
        shell: bash
        run: |
          python3 -m http.server 18080 --bind 127.0.0.1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:18080/ > /dev/null
          docker run --rm --network host \
            --env HEALTHCHECK_URL=http://127.0.0.1:18080/ \
            container-http-checker:scan
          if docker run --rm --network host \
            --env HEALTHCHECK_URL=http://127.0.0.1:18080/does-not-exist \
            container-http-checker:scan; then
            echo "::error::A 404 response must fail the healthcheck"
            exit 1
          fi

      - name: Scan container image with pinned Trivy
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:6fa071ef8daa2e58b90cbf1710bedca91adbb3bf98693533226f442035b836a6 \
            image \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            container-http-checker:scan
